services:
  demo:
    build: .
    container_name: nag-se-demo
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DEMO_MODE: ${DEMO_MODE:-rehearsal}
      NAI_UNIFIED_ENDPOINT_URL: ${NAI_UNIFIED_ENDPOINT_URL:-}
      NAI_API_KEY: ${NAI_API_KEY:-}
      NAI_UNIFIED_ENDPOINT_NAME: ${NAI_UNIFIED_ENDPOINT_NAME:-}
      MCP_URL: ${MCP_URL:-http://mcp-mock:8001/mcp}
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_PROTOCOL_VERSION: ${MCP_PROTOCOL_VERSION:-2025-06-18}
      # TLS verification is enabled by default.
      TLS_VERIFY: ${TLS_VERIFY:-true}
      # Backwards compatibility with older .env files.
      MCP_TLS_VERIFY: ${MCP_TLS_VERIFY:-true}
      MCP_POLICY_TOOL: ${MCP_POLICY_TOOL:-get_customer_policy}
      MCP_CLAIM_TOOL: ${MCP_CLAIM_TOOL:-get_claim_status}
      MCP_REPAIR_TOOL: ${MCP_REPAIR_TOOL:-find_repair_shops}
      MCP_CREATE_CLAIM_TOOL: ${MCP_CREATE_CLAIM_TOOL:-create_claim}
      MCP_BLOCKED_TOOL: ${MCP_BLOCKED_TOOL:-approve_claim_payout}
      APP_POLICY_DENY_PAYOUT: ${APP_POLICY_DENY_PAYOUT:-false}
      MOCK_LLM: ${MOCK_LLM:-true}
      ENABLE_LIVE_FALLBACK_TEST: ${ENABLE_LIVE_FALLBACK_TEST:-false}
      NAI_FALLBACK_TEST_URL: ${NAI_FALLBACK_TEST_URL:-}
      NAI_FALLBACK_TEST_KEY: ${NAI_FALLBACK_TEST_KEY:-}
      NAI_FALLBACK_TEST_MODEL: ${NAI_FALLBACK_TEST_MODEL:-}
      NAI_FALLBACK_TEST_TLS_VERIFY: ${NAI_FALLBACK_TEST_TLS_VERIFY:-true}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}

  # Local Rehearsal service. Live deployments use the NAI MCP Connector.
  mcp-mock:
    profiles: ["rehearsal"]
    build:
      context: .
      dockerfile: mock_mcp/Dockerfile
    container_name: nag-se-demo-mcp
    command: uvicorn mock_mcp.server:app --host 0.0.0.0 --port 8001
    environment:
      MOCK_MCP_EXPOSE_PAYOUT: ${MOCK_MCP_EXPOSE_PAYOUT:-true}
    ports:
      - "${MCP_MOCK_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
